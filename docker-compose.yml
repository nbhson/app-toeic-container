# ──────────────────────────────────────────────────────────────────────
#  TOEIC Container — Docker Compose
#  Services: Backend (API) + Frontend (Angular)
#  OmniRoute chạy trên host machine (http://localhost:20128)
# ──────────────────────────────────────────────────────────────────────

services:
  # ── Redis (rate limiter backend cho OmniRoute) ─────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Backend (TOEIC Reading API) ────────────────────────
  backend:
    build: ./toeic-reading-be
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    env_file:
      # Optional: the container boots with code defaults when .env is absent
      # (all BE envs have defaults; key can be saved via /api/toeic/keys).
      - path: ./toeic-reading-be/.env
        required: false
    volumes:
      # Persist keys, stats, question bank, test history AND the notebook
      # reviewed-id store (data/notebook/ added in Round 3) across rebuilds —
      # the whole data dir is bind-mounted, so all per-user stores are covered.
      - ./toeic-reading-be/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend (Angular + Nginx) ─────────────────────────
  frontend:
    build: ./toeic-reading-ui
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis-data:
    name: omniroute-redis-data
