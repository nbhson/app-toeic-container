<div class="modal-backdrop" (click)="cancel.emit()">
  <div class="modal-container animate-pop" (click)="$event.stopPropagation()">
    <div class="modal-icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="warning-icon">
        <path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" />
      </svg>
    </div>
    
    <h3 class="modal-title">{{ title() }}</h3>
    <p class="modal-message">{{ message() }}</p>
    
    <div class="modal-actions">
      <button class="btn-cancel" (click)="cancel.emit()">
        {{ cancelText() }}
      </button>
      <button class="btn-confirm" (click)="confirm.emit()">
        {{ confirmText() }}
      </button>
    </div>
  </div>
</div>
